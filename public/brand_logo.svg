<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A51818" />
      <stop offset="70%" stop-color="#801313" />
      <stop offset="100%" stop-color="#550B0B" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D375" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Opacity -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.45" />
  
  <!-- Outer Gold Rim -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Crimson Badge Fill -->
  <circle cx="150" cy="150" r="126" fill="url(#badgeGlow)" />

  <!-- Inner Subtle Gold Accent Ring -->
  <circle cx="150" cy="150" r="121" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Left Side: "bc" Script Logo & Text -->
  <g fill="#FFFFFF" text-anchor="middle">
    <!-- "bc" stylized cursive monogram -->
    <path d="M 82 120 C 74 120 68 126 68 135 C 68 148 80 156 94 156 C 102 156 109 152 113 147 L 111 143 C 107 147 101 150 94 150 C 84 150 75 143 75 135 C 75 129 79 125 84 125 C 89 125 93 128 95 132 L 101 129 C 98 123 91 120 82 120 Z" fill="#FFFFFF" />
    <path d="M 98 110 L 105 110 L 105 155 L 98 155 Z" fill="#FFFFFF" />
    
    <!-- Underline curve -->
    <path d="M 64 160 Q 90 166 122 158 Q 128 163 124 165 Q 90 173 60 164 Z" fill="#FFFFFF" />

    <!-- Arabic Text -->
    <text x="92" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1">بومباي شوباتي</text>

    <!-- English Text -->
    <text x="92" y="184" font-family="'Arial Black', sans-serif" font-size="6.8" font-weight="900" letter-spacing="0.8">BOMBAY CHOWPATTY</text>
  </g>

  <!-- Right Side: The Smiling Chef Mascot with Hat & Spectacles -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chef Hat -->
    <!-- Puffy Top of Hat -->
    <path d="M 172 88 C 160 84 152 94 156 104 C 150 110 154 120 162 122 C 160 128 168 134 176 132 C 182 134 192 130 192 122 C 200 120 206 110 200 102 C 204 94 196 84 186 86 C 182 82 176 84 172 88 Z" fill="#FFFFFF" fill-opacity="0.1" stroke-width="4" />
    
    <!-- Hat Base / Band tilted -->
    <path d="M 162 122 L 195 125 L 192 136 L 160 132 Z" fill="#FFFFFF" stroke-width="3.5" />
    
    <!-- Hat Crease Lines -->
    <path d="M 174 95 Q 176 112 175 122" stroke-width="2.5" />
    <path d="M 184 94 Q 186 110 187 123" stroke-width="2.5" />

    <!-- Face Outline / Chin -->
    <path d="M 160 138 C 152 152 155 178 174 195 C 190 202 210 196 218 180 C 224 166 220 146 202 138" fill="#801313" stroke-width="4" />

    <!-- Big Round Spectacles / Eyes -->
    <!-- Left Eye Lens -->
    <circle cx="174" cy="155" r="10" fill="#FFFFFF" stroke-width="3.5" stroke="#FFFFFF" />
    <circle cx="176" cy="155" r="4.5" fill="#801313" stroke="none" />
    <circle cx="178" cy="153" r="1.5" fill="#FFFFFF" stroke="none" />

    <!-- Right Eye Lens -->
    <circle cx="196" cy="157" r="10" fill="#FFFFFF" stroke-width="3.5" stroke="#FFFFFF" />
    <circle cx="194" cy="157" r="4.5" fill="#801313" stroke="none" />
    <circle cx="196" cy="155" r="1.5" fill="#FFFFFF" stroke="none" />

    <!-- Glasses Bridge -->
    <path d="M 184 156 Q 185 153 186 156" stroke-width="3.5" fill="none" />

    <!-- Nose -->
    <path d="M 186 160 Q 192 168 184 172" stroke-width="3" fill="none" />

    <!-- Big Cheerful Open Smile with Tongue/Teeth -->
    <path d="M 166 174 Q 184 198 208 175 C 200 194 176 195 166 174 Z" fill="#FFFFFF" stroke-width="3" />
    <!-- Mustache -->
    <path d="M 170 172 Q 184 176 186 170 Q 188 176 204 173" stroke-width="3.5" fill="none" />

    <!-- Cute Cheeks -->
    <ellipse cx="160" cy="166" rx="4" ry="3" fill="url(#goldGrad)" stroke="none" opacity="0.8" />
    <ellipse cx="210" cy="168" rx="4" ry="3" fill="url(#goldGrad)" stroke="none" opacity="0.8" />

    <!-- Bow Tie -->
    <path d="M 174 200 L 194 208 L 194 200 L 174 208 Z" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="184" cy="204" r="3" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Little Gold Stars / Sparkles -->
  <path d="M 235 90 Q 235 96 229 96 Q 235 96 235 102 Q 235 96 241 96 Q 235 96 235 90 Z" fill="url(#goldGrad)" />
  <path d="M 65 95 Q 65 99 61 99 Q 65 99 65 103 Q 65 99 69 99 Q 65 99 65 95 Z" fill="url(#goldGrad)" />
  <path d="M 150 40 Q 150 45 145 45 Q 150 45 150 50 Q 150 45 155 45 Q 150 45 150 40 Z" fill="url(#goldGrad)" />
</svg>
