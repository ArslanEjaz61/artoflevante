<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" />
      <stop offset="40%" stop-color="#C0392B" />
      <stop offset="100%" stop-color="#801313" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#D68910" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#FFE082" stroke-width="2" stroke-opacity="0.5" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />

  <!-- Crown VIP Emblem -->
  <g filter="url(#shadow)">
    <!-- Crown Base Band -->
    <path d="M34 82 L94 82 C96 82 97 84 96 86 L94 90 C93.5 91.5 92 92.5 90 92.5 L38 92.5 C36 92.5 34.5 91.5 34 90 L32 86 C31 84 32 82 34 82 Z" fill="url(#goldGrad)" />
    <circle cx="46" cy="87" r="2" fill="#801313" />
    <circle cx="64" cy="87" r="2.5" fill="#FFFFFF" />
    <circle cx="82" cy="87" r="2" fill="#801313" />

    <!-- Crown Peaks -->
    <path d="M34 80 L28 48 C27.5 45.5 31 44 32.5 46 L46 64 L60 36 C61 34 67 34 68 36 L82 64 L95.5 46 C97 44 100.5 45.5 100 48 L94 80 Z" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="0.8" />
    
    <!-- Crown Peak Jewels -->
    <circle cx="29" cy="46" r="4.5" fill="url(#goldGrad2)" />
    <circle cx="64" cy="34" r="6.5" fill="url(#goldGrad2)" filter="url(#glow)" />
    <circle cx="99" cy="46" r="4.5" fill="url(#goldGrad2)" />
    
    <!-- Central Luxury Star Sparkle -->
    <path d="M64 48 Q64 57 55 57 Q64 57 64 66 Q64 57 73 57 Q64 57 64 48 Z" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- Sparkle Accents -->
  <path d="M98 18 Q98 23 93 23 Q98 23 98 28 Q98 23 103 23 Q98 23 98 18 Z" fill="#FFE082" opacity="0.9" />
  <path d="M22 96 Q22 100 18 100 Q22 100 22 104 Q22 100 26 100 Q22 100 22 96 Z" fill="#FFE082" opacity="0.85" />
</svg>
